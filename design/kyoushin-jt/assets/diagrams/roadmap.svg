="400" text-anchor="start">重複ページ（Renovation×2 等）を統合</text><rect x="360" y="302" width="280" height="24" rx="5" fill="#1F4A3D" stroke="#1F4A3D" stroke-width="1"/><text x="370" y="318" font-size="11.5" fill="#fff" font-weight="700" text-anchor="start">Phase 1　サイト全面リニューアル</text><text x="48" y="318" font-size="13" fill="#1F4A3D" font-weight="700" text-anchor="start">Phase 1</text><text x="110" y="318" font-size="12" fill="#1A1A1A" font-weight="700" text-anchor="start">サイト全面リニューアル</text><text x="648" y="318" font-size="9.5" fill="#5C5C5C" font-weight="400" text-anchor="start">約14週</text><circle cx="368" cy="336" r="2.4" fill="#1F4A3D"/><text x="378" y="340" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">要件・IA確定（2週）</text><circle cx="368" cy="353" r="2.4" fill="#1F4A3D"/><text x="378" y="357" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">ワイヤー → デザイン 全9テンプレート（4週）</text><circle cx="368" cy="370" r="2.4" fill="#A8481F"/><text x="378" y="374" font-size="10.5" fill="#A8481F" font-weight="700" text-anchor="start">★ 原稿作成・写真整理（発注者作業・最大のボトルネック）</text><circle cx="368" cy="387" r="2.4" fill="#1F4A3D"/><text x="378" y="391" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">CMS構築／物件・事例のDB化（4週）</text><circle cx="368" cy="404" r="2.4" fill="#1F4A3D"/><text x="378" y="408" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">コンテンツ投入・データ移行（2週）</text><circle cx="368" cy="421" r="2.4" fill="#1F4A3D"/><text x="378" y="425" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">受入検証 → 301リダイレクト → 公開</text><rect x="640" y="454" width="380" height="24" rx="5" fill="#3E7A63" stroke="#3E7A63" stroke-width="1"/><text x="650" y="470" font-size="11.5" fill="#fff" font-weight="700" text-anchor="start">Phase 2　集客強化</text><text x="48" y="470" font-size="13" fill="#3E7A63" font-weight="700" text-anchor="start">Phase 2</text><text x="110" y="470" font-size="12" fill="#1A1A1A" font-weight="700" text-anchor="start">集客強化</text><text x="1028" y="470" font-size="9.5" fill="#5C5C5C" font-weight="400" text-anchor="start">約19週</text><circle cx="648" cy="488" r="2.4" fill="#3E7A63"/><text x="658" y="492" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">エリア別ページ（町名単位で面を取る）</text><circle cx="648" cy="505" r="2.4" fill="#A8481F"/><text x="658" y="509" font-size="10.5" fill="#A8481F" font-weight="700" text-anchor="start">★ 光熱費シミュレーター（性能をお金に翻訳）</text><circle cx="648" cy="522" r="2.4" fill="#3E7A63"/><text x="658" y="526" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">お客様の声・引渡し後インタビュー</text><circle cx="648" cy="539" r="2.4" fill="#3E7A63"/><text x="658" y="543" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">資金計画シミュレーター／間取り検索</text><circle cx="648" cy="556" r="2.4" fill="#3E7A63"/><text x="658" y="560" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">来場予約カレンダー／採用セクション</text><rect x="640" y="589" width="540" height="24" rx="5" fill="#7A8B84" stroke="#7A8B84" stroke-width="1"/><text x="650" y="605" font-size="11.5" fill="#fff" font-weight="700" text-anchor="start">Phase 3　継続運用</text><text x="48" y="605" font-size="13" fill="#7A8B84" font-weight="700" text-anchor="start">Phase 3</text><text x="110" y="605" font-size="12" fill="#1A1A1A" font-weight="700" text-anchor="start">継続運用</text><text x="1188" y="605" font-size="9.5" fill="#5C5C5C" font-weight="400" text-anchor="start">約27週</text><circle cx="648" cy="623" r="2.4" fill="#7A8B84"/><text x="658" y="627" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">物件の追加・価格改定・ステータス変更（随時／即日）</text><circle cx="648" cy="640" r="2.4" fill="#7A8B84"/><text x="658" y="644" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">施工事例・お知らせ（月2回以上）</text><circle cx="648" cy="657" r="2.4" fill="#7A8B84"/><text x="658" y="661" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">GA4月次レポート・404チェック</text><circle cx="648" cy="674" r="2.4" fill="#7A8B84"/><text x="658" y="678" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">Core Web Vitals／アクセシビリティ 半期監査</text><rect x="48" y="713" width="1152" height="74" rx="4" fill="#FBF1EA" stroke="#A8481F" stroke-width="1.4"/><text x="64" y="735" font-size="11.5" fill="#A8481F" font-weight="700" text-anchor="start">進め方の要点</text><text x="64" y="753" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">・Phase 0 の「titleの書き換え」だけでも効果があります。現行CMSのままできて、以降の投資判断の材料にもなります。</text><text x="64" y="769" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">・Phase 1 で最も遅れるのは制作ではなく「原稿と写真」です。着手と同時に発注者側で進めてください。</text><text x="64" y="785" font-size="10.5" fill="#1A1A1A" font-weight="400" text-anchor="start">・Phase 3 の運用体制を決めてから Phase 1 に着手してください。更新が止まったサイトは、リニューアル前より価値が下がります。</text></svg>